<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100" role="img" aria-labelledby="title desc">
  <title id="title">hallucination-gate  End-to-End Architecture</title>
  <desc id="desc">Visual architecture of the conservative grounding firewall: surfaces, pipeline, claim lock, Bayesian fusion, and gate actions.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="1100" fill="#f8fafc"/>
  <rect x="0" y="0" width="1400" height="72" fill="#0f172a"/>

  <!-- Header -->
  <text x="40" y="32" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">hallucination-gate v0.9.4</text>
  <text x="40" y="56" fill="#f8fafc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">End-to-End Architecture  Conservative Grounding Firewall</text>
  <text x="1360" y="44" text-anchor="end" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">CTO visual · false-release SLO first</text>

  <!-- ========== LAYER 1: CALLER ========== -->
  <rect x="40" y="100" width="1320" height="90" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#soft)"/>
  <text x="60" y="128" fill="#64748b" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.06em">YOUR APPLICATION</text>
  <rect x="60" y="142" width="280" height="32" rx="6" fill="#e2e8f0"/>
  <text x="200" y="163" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Retriever (any)</text>
  <rect x="360" y="142" width="280" height="32" rx="6" fill="#e2e8f0"/>
  <text x="500" y="163" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Generator / LLM (any)</text>
  <rect x="660" y="142" width="380" height="32" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="850" y="163" text-anchor="middle" fill="#475569" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">query · answer · evidence (chunks / PDF / OCR / tables)</text>
  <text x="1100" y="163" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">not owned by this package</text>

  <!-- Arrow down -->
  <line x1="700" y1="190" x2="700" y2="220" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ========== LAYER 2: SURFACES ========== -->
  <rect x="40" y="220" width="1320" height="100" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#soft)"/>
  <text x="60" y="248" fill="#64748b" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.06em">PUBLIC SURFACES (same engine)</text>

  <rect x="60" y="262" width="300" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="210" y="287" text-anchor="middle" fill="#1d4ed8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Python SDK</text>
  <text x="210" y="248" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">HallucinationGate · RAGEval</text>

  <rect x="390" y="262" width="300" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="540" y="287" text-anchor="middle" fill="#1d4ed8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">CLI · hallucination-gate</text>

  <rect x="720" y="262" width="300" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="870" y="287" text-anchor="middle" fill="#1d4ed8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">HTTP · /v1/answer</text>

  <rect x="1050" y="262" width="280" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
  <text x="1190" y="287" text-anchor="middle" fill="#475569" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">/evaluate (internal)</text>

  <line x1="210" y1="302" x2="700" y2="340" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="302" x2="700" y2="340" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="870" y1="302" x2="700" y2="340" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1190" y1="302" x2="700" y2="340" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- ========== LAYER 3: ENGINE PIPELINE ========== -->
  <rect x="40" y="340" width="1320" height="420" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#soft)"/>
  <text x="60" y="368" fill="#64748b" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.06em">ENGINE · DiagnosticEvaluator.evaluate</text>

  <!-- Pipeline boxes row 1 -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- 1 Adapt -->
    <rect x="60" y="390" width="150" height="70" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="135" y="418" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="700">1. Adapt</text>
    <text x="135" y="438" text-anchor="middle" fill="#64748b" font-size="11">normalize_context</text>
    <text x="135" y="452" text-anchor="middle" fill="#94a3b8" font-size="10">LangChain · dicts · PDF</text>

    <!-- 2 Store -->
    <rect x="240" y="390" width="150" height="70" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="315" y="418" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="700">2. Evidence store</text>
    <text x="315" y="438" text-anchor="middle" fill="#64748b" font-size="11">OCR · align · units</text>
    <text x="315" y="452" text-anchor="middle" fill="#94a3b8" font-size="10">text · image · table · audio</text>

    <!-- 3 Claims -->
    <rect x="420" y="390" width="150" height="70" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="495" y="418" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="700">3. Extract claims</text>
    <text x="495" y="438" text-anchor="middle" fill="#64748b" font-size="11">sentence · CJK · bullets</text>
    <text x="495" y="452" text-anchor="middle" fill="#94a3b8" font-size="10">atomic facts</text>

    <!-- 4 VERIFY LOCK -->
    <rect x="600" y="385" width="190" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="695" y="412" text-anchor="middle" fill="#1d4ed8" font-size="13" font-weight="800">4. VERIFY CLAIMS</text>
    <text x="695" y="432" text-anchor="middle" fill="#2563eb" font-size="12" font-weight="700"> THE LOCK</text>
    <text x="695" y="450" text-anchor="middle" fill="#64748b" font-size="10">embed · NLI · coverage · soft-OR</text>

    <!-- 5 Scores -->
    <rect x="820" y="390" width="150" height="70" rx="8" fill="#f1f5f9" stroke="#64748b"/>
    <text x="895" y="418" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="700">5. Score</text>
    <text x="895" y="438" text-anchor="middle" fill="#64748b" font-size="11">9 evidence dims</text>
    <text x="895" y="452" text-anchor="middle" fill="#94a3b8" font-size="10">continuous ’ L/M/H</text>

    <!-- 6 BN -->
    <rect x="1000" y="390" width="150" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="5 3"/>
    <text x="1075" y="418" text-anchor="middle" fill="#475569" font-size="13" font-weight="700">6. Bayesian BN</text>
    <text x="1075" y="438" text-anchor="middle" fill="#64748b" font-size="11">Variable Elimination</text>
    <text x="1075" y="452" text-anchor="middle" fill="#94a3b8" font-size="10">fusion · not the lock</text>

    <!-- 7 Gate -->
    <rect x="1180" y="385" width="150" height="80" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2.5"/>
    <text x="1255" y="412" text-anchor="middle" fill="#047857" font-size="13" font-weight="800">7. GATE</text>
    <text x="1255" y="432" text-anchor="middle" fill="#059669" font-size="11" font-weight="700">pass · rewrite · abstain</text>
    <text x="1255" y="450" text-anchor="middle" fill="#64748b" font-size="10">safe_answer only</text>
  </g>

  <!-- Pipeline arrows -->
  <line x1="210" y1="425" x2="236" y2="425" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="390" y1="425" x2="416" y2="425" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="425" x2="596" y2="425" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowAccent)"/>
  <line x1="790" y1="425" x2="816" y2="425" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="970" y1="425" x2="996" y2="425" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1150" y1="425" x2="1176" y2="425" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Claim lock detail panel -->
  <rect x="60" y="500" width="640" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="80" y="528" fill="#1d4ed8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="800">Claim lock detail (step 4)</text>
  <text x="80" y="552" fill="#475569" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Per claim × top-8 chunks · then soft-OR aggregate</text>

  <rect x="80" y="568" width="130" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="145" y="591" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">coverage</text>
  <rect x="220" y="568" width="130" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="285" y="591" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">NLI entail/contra</text>
  <rect x="360" y="568" width="130" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="425" y="591" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">numbers / literals</text>
  <rect x="500" y="568" width="170" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="585" y="591" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600">extra entities (e2 ’ fail)</text>

  <text x="80" y="630" fill="#64748b" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">Verdict priority</text>
  <rect x="80" y="642" width="140" height="28" rx="4" fill="#fef2f2" stroke="#ef4444"/>
  <text x="150" y="661" text-anchor="middle" fill="#b91c1c" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">CONTRADICTED</text>
  <rect x="235" y="642" width="120" height="28" rx="4" fill="#ecfdf5" stroke="#059669"/>
  <text x="295" y="661" text-anchor="middle" fill="#047857" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">SUPPORTED</text>
  <rect x="370" y="642" width="110" height="28" rx="4" fill="#fffbeb" stroke="#d97706"/>
  <text x="425" y="661" text-anchor="middle" fill="#b45309" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">UNCERTAIN</text>
  <rect x="495" y="642" width="130" height="28" rx="4" fill="#f1f5f9" stroke="#64748b"/>
  <text x="560" y="661" text-anchor="middle" fill="#475569" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">UNSUPPORTED</text>

  <text x="80" y="700" fill="#475569" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Similarity alone never releases. Contradiction bar stays 0.55 (strict &amp; balanced).</text>
  <text x="80" y="718" fill="#64748b" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Soft-OR: neighbor chunk with unrelated numbers cannot veto a claim another chunk supports.</text>

  <!-- BN + Gate panel -->
  <rect x="720" y="500" width="610" height="230" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="740" y="528" fill="#475569" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="800">Bayesian fusion (step 6) · Gate (step 7)</text>

  <!-- Mini BN -->
  <text x="740" y="555" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">EVIDENCE ’ LATENTS</text>
  <rect x="740" y="568" width="100" height="24" rx="4" fill="#e2e8f0"/>
  <text x="790" y="584" text-anchor="middle" fill="#334155" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">faithfulness</text>
  <rect x="850" y="568" width="80" height="24" rx="4" fill="#e2e8f0"/>
  <text x="890" y="584" text-anchor="middle" fill="#334155" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">entailment</text>
  <rect x="940" y="568" width="90" height="24" rx="4" fill="#e2e8f0"/>
  <text x="985" y="584" text-anchor="middle" fill="#334155" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">unsupported</text>
  <rect x="1040" y="568" width="90" height="24" rx="4" fill="#e2e8f0"/>
  <text x="1085" y="584" text-anchor="middle" fill="#334155" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">contradiction</text>

  <line x1="890" y1="592" x2="890" y2="610" stroke="#94a3b8" stroke-width="1"/>
  <line x1="1085" y1="592" x2="1085" y2="610" stroke="#94a3b8" stroke-width="1"/>

  <rect x="820" y="612" width="120" height="28" rx="5" fill="#dbeafe" stroke="#2563eb"/>
  <text x="880" y="631" text-anchor="middle" fill="#1d4ed8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">groundedness</text>
  <rect x="980" y="612" width="140" height="28" rx="5" fill="#fee2e2" stroke="#ef4444"/>
  <text x="1050" y="631" text-anchor="middle" fill="#b91c1c" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">hallucination_risk</text>

  <line x1="880" y1="640" x2="940" y2="658" stroke="#94a3b8" stroke-width="1"/>
  <line x1="1050" y1="640" x2="1000" y2="658" stroke="#94a3b8" stroke-width="1"/>

  <rect x="900" y="658" width="130" height="28" rx="5" fill="#ecfdf5" stroke="#059669"/>
  <text x="965" y="677" text-anchor="middle" fill="#047857" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">release_safety</text>

  <text x="740" y="710" fill="#64748b" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Score = P(high) + 0.5·P(medium) · veto OFF by default</text>
  <text x="740" y="728" fill="#475569" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">Gate: contradict ’ abstain · junk ’ rewrite · else pass</text>

  <!-- ========== OUTPUT ========== -->
  <line x1="700" y1="760" x2="700" y2="790" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="40" y="790" width="1320" height="120" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2" filter="url(#soft)"/>
  <text x="60" y="818" fill="#047857" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="0.06em">OUTPUTS</text>

  <rect x="60" y="835" width="280" height="55" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="200" y="858" text-anchor="middle" fill="#047857" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="800">GatedAnswer.text</text>
  <text x="200" y="876" text-anchor="middle" fill="#059669" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">= safe_answer (user-facing)</text>

  <rect x="360" y="835" width="280" height="55" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="500" y="858" text-anchor="middle" fill="#166534" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">EvalReport</text>
  <text x="500" y="876" text-anchor="middle" fill="#16a34a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">faithfulness · retrieval · latency · regression</text>

  <rect x="660" y="835" width="280" height="55" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="800" y="858" text-anchor="middle" fill="#166534" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">SafeAnswerResponse</text>
  <text x="800" y="876" text-anchor="middle" fill="#16a34a" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">HTTP /v1/answer  never raw model text</text>

  <rect x="960" y="835" width="370" height="55" rx="8" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="1145" y="858" text-anchor="middle" fill="#b45309" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Modes · Policies</text>
  <text x="1145" y="876" text-anchor="middle" fill="#d97706" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">ci|quality × strict|balanced · warm=True</text>

  <!-- Footer -->
  <rect x="40" y="940" width="1320" height="120" rx="12" fill="#0f172a"/>
  <text x="60" y="970" fill="#f8fafc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">North star</text>
  <text x="60" y="994" fill="#cbd5e1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Do not show an answer the supplied evidence cannot support. Prefer abstention over a false release.</text>
  <text x="60" y="1020" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">Checks support, not world truth. Bad retrieval still hurts. Heuristic CI ` production quality gate.</text>
  <text x="60" y="1044" fill="#64748b" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Full write-up: ARCHITECTURE.md · Package: hallucination-gate · Engine: bayesian_rag_evaluator</text>
  <text x="1340" y="1044" text-anchor="end" fill="#64748b" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">Shreyas G · MIT</text>
</svg>
