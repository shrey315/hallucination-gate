# Continuous score bin edges for discretization into {low, medium, high}
bins:
  query_relevance: [0.35, 0.65]
  context_faithfulness: [0.35, 0.65]
  entailment_score: [0.35, 0.65]
  retrieval_quality: [0.35, 0.65]
  completeness: [0.35, 0.65]
  contradiction: [0.28, 0.55]
  unsupported_claims: [0.20, 0.50]
  visual_grounding: [0.35, 0.65]
  numeric_consistency: [0.50, 0.85]

# Posterior fusion-score thresholds for verdict (not calibrated probabilities)
verdict:
  pass_quality: 0.70
  pass_groundedness: 0.68
  max_hallucination_risk: 0.25
  min_release_safety: 0.62

# Prefer abstention over a false release
gate:
  max_hallucination_risk: 0.22
  min_groundedness: 0.70
  min_release_safety: 0.65
  min_rewrite_completeness: 0.28
  min_rewrite_overlap: 0.16

gap:
  high: 0.40
  medium: 0.60

levels:
  - low
  - medium
  - high
