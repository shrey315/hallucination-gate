name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test (heuristic production path)
        env:
          RAG_EVAL_HEURISTIC: "1"
        run: pytest -q --tb=short -m "not neural"
      - name: Neural backends (optional)
        continue-on-error: true
        env:
          RAG_EVAL_HEURISTIC: "0"
          RAG_EVAL_NEURAL: "1"
        run: pytest -q --tb=short -m neural
