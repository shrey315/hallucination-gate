  hallucination_risk:
    parents: [unsupported_claims, contradiction, numeric_consistency]
    invert: [numeric_consistency]
    composite_groups:
      0: [0.80, 0.15, 0.05]
      1: [0.70, 0.22, 0.08]
      2: [0.55, 0.30, 0.15]
      3: [0.35, 0.40, 0.25]
      4: [0.18, 0.32, 0.50]
      5: [0.08, 0.22, 0.70]
      6: [0.03, 0.12, 0.85]

  answer_quality:
    parents: [query_relevance, completeness, groundedness, hallucination_risk]
    invert: [hallucination_risk]
    composite_groups:
      0: [0.80, 0.15, 0.05]
      1: [0.70, 0.22, 0.08]
      2: [0.55, 0.30, 0.15]
      3: [0.40, 0.38, 0.22]
      4: [0.25, 0.45, 0.30]
      5: [0.15, 0.40, 0.45]
