# Bayesian Network for hallucination-controlled RAG/LLM evaluation
# States: [low, medium, high] unless noted. model_type: [rag, fine_tuned]

nodes:
  evidence:
    - query_relevance
    - context_faithfulness
    - entailment_score
    - retrieval_quality
    - completeness
    - contradiction
    - unsupported_claims
    - visual_grounding
    - numeric_consistency
    - model_type
  latent:
    - groundedness
    - hallucination_risk
    - answer_quality
    - retrieval_adequacy
    - release_safety

edges:
  - [context_faithfulness, groundedness]
  - [entailment_score, groundedness]
  - [visual_grounding, groundedness]
  - [unsupported_claims, hallucination_risk]
  - [contradiction, hallucination_risk]
  - [numeric_consistency, hallucination_risk]
  - [query_relevance, answer_quality]
  - [completeness, answer_quality]
  - [groundedness, answer_quality]
  - [hallucination_risk, answer_quality]
  - [retrieval_quality, retrieval_adequacy]
  - [model_type, retrieval_adequacy]
  - [groundedness, release_safety]
  - [hallucination_risk, release_safety]

cpts:
  query_relevance:
    parents: []
    values: [0.333, 0.333, 0.334]
  context_faithfulness:
    parents: []
    values: [0.333, 0.333, 0.334]
  entailment_score:
    parents: []
    values: [0.333, 0.333, 0.334]
  retrieval_quality:
    parents: []
    values: [0.333, 0.333, 0.334]
  completeness:
    parents: []
    values: [0.333, 0.333, 0.334]
  contradiction:
    parents: []
    values: [0.333, 0.333, 0.334]
  unsupported_claims:
    parents: []
    values: [0.333, 0.333, 0.334]
  visual_grounding:
    parents: []
    values: [0.333, 0.333, 0.334]
  numeric_consistency:
    parents: []
    values: [0.333, 0.333, 0.334]
